[project]
name = "ml-commons"
version = "0.1.0"
description = "Shared utilities for ML projects"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "wandb>=0.27",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_commons"]
